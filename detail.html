<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOMENTS · 照片详情</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome 6 免费图标库 (自带 beat/bounce/fade/flip/shake/spin 动效) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="page-detail">

  <!-- 无障碍跳转链接 -->
  <a href="#main-content" class="skip-link">跳转到主内容</a>

  <!-- 页面过渡遮罩 -->
  <div class="page-transition" id="pageTransition" aria-hidden="true"></div>
  <div class="film-scanlines" aria-hidden="true"></div>

  <a href="index.html" class="back-link" id="backLink" aria-label="返回索引页">← INDEX</a>
  <button type="button" class="immersive-toggle" id="immersiveToggle" aria-pressed="false" aria-label="沉浸浏览">FULL</button>

  <main class="detail-layout" id="main-content">

    <section class="detail-left">
      <!-- 左栏背景色叠加层（图片主题色互补色） -->
      <div class="detail-left-bg" id="detailLeftBg"></div>

      <!-- 胶片齿孔装饰条 -->
      <div class="sprocket-strip">
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
        <div class="sprocket-hole"></div>
      </div>

      <!-- 左下角章节装饰 -->
      <div class="detail-corner-deco">
        <div class="deco-dot"></div>
        <div class="deco-dot"></div>
        <div class="deco-dot"></div>
      </div>

      <div class="detail-left-inner" id="detailLeftInner">
        <span class="detail-accent"></span>
        <p class="detail-chapter" id="detailChapter">CHAPTER 01</p>
        <p class="detail-chapter-sub" id="detailChapterSub">YUNNAN · CHINA</p>
        <p class="detail-date-range" id="detailDateRange"></p>
        <!-- 动画装饰图标 -->
        <div class="detail-deco-icon" id="detailDecoIcon"></div>
        <h1 class="detail-title" id="detailTitle"></h1>
        <p class="detail-tags" id="detailTags"></p>

        <div class="detail-timestamps" id="detailTimestamps">
        </div>

        <p class="detail-desc" id="detailDesc"></p>

        <div class="detail-stamp">
          <span class="stamp-text">2026 JAYA</span>
        </div>
      </div>
    </section>

    <!-- 左右分栏中间的幕帘装饰 -->
    <div class="panel-curtain"></div>

    <section class="detail-right" id="detailRight">
      <div class="detail-photo-tint" id="detailPhotoTint" aria-hidden="true"></div>
      <div class="grain-overlay"></div>

      <!-- 胶片视频感转场：快门帘 + 光晕（参考 Awwwards 摄影站常见手法） -->
      <div class="film-cut" id="filmCut" aria-hidden="true">
        <div class="film-cut-flash"></div>
        <div class="film-cut-bar"></div>
        <div class="film-cut-shutters" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="swiper swiper-fade" id="mainSwiper">
        <div class="swiper-wrapper" id="swiperWrapper">
        </div>
      </div>

      <div class="zoom-hint-text" id="zoomHint">CLICK TO EXPAND</div>

      <div class="film-meta" id="filmMeta">
        <span class="film-roll" id="filmRoll">ROLL 01</span>
        <span class="film-stock" id="filmStock">KODAK PORTRA 400</span>
        <span class="film-exp" id="filmExp">01 EXP</span>
      </div>

      <div class="camera-params">
        <span class="cam-iso">ISO 400</span>
        <span class="cam-aperture">f/2.8</span>
        <span class="cam-speed">1/500</span>
      </div>

      <div class="vertical-dots" id="verticalDots">
      </div>
    </section>

  </main>

  <footer class="detail-footer">
    <div class="detail-footer-divider"></div>
    <div class="detail-footer-row">
      <p class="detail-page" id="detailPage">01 / 08</p>
      <div class="detail-nav">
        <button class="detail-nav-btn" id="detailPrev" aria-label="上一张照片">← PREV</button>
        <button class="detail-nav-btn" id="detailNext" aria-label="下一张照片">NEXT →</button>
      </div>
    </div>
  </footer>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-bg"></div>
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    <div class="lightbox-content">
      <img src="" alt="" id="lightboxImg">
    </div>
    <button class="lightbox-arrow lightbox-prev" id="lightboxPrev" aria-label="上一张">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <button class="lightbox-arrow lightbox-next" id="lightboxNext" aria-label="下一张">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
    <p class="lightbox-counter" id="lightboxCounter">01 / 08</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="motion.js"></script>
  <script src="anim.js"></script>
  <script src="script.js"></script>
</body>
</html>
