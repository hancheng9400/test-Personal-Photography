<!DOCTYPE html>

<body class="page-index">

      <!-- 装饰元素 -->
      <div class="corner-mark corner-mark-tl"></div>

          <h1 class="index-title" text-split letters-slide-up>MOMENTS</h1>

        <div class="index-toc" id="indexToc">
        </div>

        <a href="detail.html?slide=0" class="index-enter" id="indexEnter" aria-label="进入照片集">ENTER ROLL</a>
        <p class="index-footnote" text-split words-slide-up>SCROLL TO EXPLORE</p>
      </div>
    </section>

    <section class="index-right" id="indexRight">
      <div class="index-grid" id="indexGrid">
      </div>
    </section>

  <script src="anim.js"></script>
